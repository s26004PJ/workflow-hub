<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow Hub</title><style>
:root{--n:#13233f;--b:#2563eb;--sky:#eaf2ff;--g:#15803d;--r:#b91c1c;--a:#b45309;--bg:#f5f7fb;--w:#fff;--l:#dbe2ea;--t:#172033;--m:#667085;--rad:14px}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:64px;background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand{font-weight:800}.top-actions{display:flex;gap:8px;align-items:center}.top button{border:1px solid #ffffff40;background:#ffffff12;color:#fff;padding:8px 12px;border-radius:9px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef4ff,#f8fafc)}.auth{width:min(520px,100%);background:#fff;border:1px solid var(--l);border-radius:20px;padding:30px;box-shadow:0 18px 50px #10203b18}.auth h1{margin:0 0 6px}.auth>p{color:var(--m);margin:0 0 22px}.tabs{display:flex;background:#f1f5f9;padding:4px;border-radius:10px;margin-bottom:18px}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px}.tabs .active{background:#fff;box-shadow:0 1px 5px #0001;font-weight:700}label{display:block;font-weight:650;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid var(--l);border-radius:9px;padding:10px 11px;background:#fff;color:var(--t)}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--b);color:#fff}.secondary{background:#eef2f7;color:var(--t)}.danger{background:#fee2e2;color:var(--r)}.success{background:#dcfce7;color:var(--g)}.warning{background:#fef3c7;color:var(--a)}.auth .btn{width:100%;margin-top:16px}.msg{padding:10px 12px;border-radius:9px;margin:12px 0;font-size:13px}.msg.err{background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--l);padding:16px;position:sticky;top:64px;height:calc(100vh - 64px)}nav button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;margin:2px 0;color:#334155}nav button.active,nav button:hover{background:var(--sky);color:#1745a0;font-weight:700}.side-user{padding:12px;background:#f8fafc;border-radius:10px;margin-bottom:14px;font-size:13px}.content{padding:24px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.page-head h2{margin:0 0 5px}.muted{color:var(--m)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--w);border:1px solid var(--l);border-radius:var(--rad);padding:17px}.metric{font-size:27px;font-weight:800;margin-top:5px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--l);border-radius:var(--rad)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px 12px;border-bottom:1px solid var(--l);text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;font-size:12px;color:#475467}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions .btn{padding:7px 9px;font-size:12px}.notice{border-left:4px solid var(--b);background:#eff6ff;padding:12px;border-radius:8px;margin:8px 0}.notice.unread{border-left-color:#ef4444;background:#fff7f7}.modal{position:fixed;inset:0;background:#0b122066;display:grid;place-items:center;padding:20px;z-index:50}.modal-box{background:#fff;border-radius:16px;width:min(7 </style></head><body>
<div id="loginScreen" class="login-wrap"><div style="position:fixed;top:18px;right:18px;z-index:30"><button class="btn secondary" onclick="toggleLang()" id="authLang">English</button></div><div class="auth"><h1 id="authTitle"></h1><p id="authSub"></p><div class="tabs"><button id="loginTab" onclick="showAuth('login')"></button><button id="regTab" onclick="showAuth('register')"></button></div><div id="authMsg"></div><form id="loginForm"><label id="lu"></label><input id="loginUser" required autocomplete="username"><label id="lp"></label><input id="loginPass" type="password" required autocomplete="current-password"><button class="btn primary" id="loginBtn"></button><div class="small muted" id="demo"></div></form><form id="registerForm" class="hidden"><div class="row"><div><label id="rn"></label><input id="rName" required></div><div><label id="ru"></label><input id="rUser" required></div></div><div class="row"><div><label id="rp"></label><input id="rPass" type="password" required></div><div><label id="rc"></label><input id="rPass2" type="password" required></div></div><label id="re"></label><input id="rEmail" type="email" required><div class="row"><div><label id="rd"></label><input id="rDept" required></div><div><label id="rpo"></label><input id="rPosition" required></div></div><label id="rr"></label><select id="rRole"><option value="employee"></option><option value="manager"></option></select><button class="btn primary" id="regBtn"></button></form></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand">WORKFLOW HUB</div><div class="top-actions"><span id="userBadge" class="user-name"></span><button onclick="toggleLang()" id="langBtn"></button><button onclick="logout()" id="logoutBtn"></button></div></header><div class="layout"><aside><div class="side-user"><b id="sideName"></b><br><span id="sideRole" class="muted"></span><br><span id="sideDept" class="muted"></span></div><nav id="nav"></nav></aside><main class="content" id="main"></main></div></div><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalBox"></div></div>
<script>
const J={system:"社内ワークフロー",loginSub:"Username と Password でログインしてください。",registerSub:"社員・管理者アカウントを登録してください。",login:"ログイン",create:"アカウントを作成",username:"ユーザー名",password:"パスワード",confirm:"パスワード（確認）",name:"氏名",email:"Email",department:"部署",position:"役職",accountType:"アカウント種別",employee:"社員",manager:"管理者",demo:"デモ: employee / 1234 ・ manager / 1234",dashboard:"ダッシュボード",newApp:"新規申請",myApps:"自分の申請",approvals:"承認待ち",employees:"社員管理",history:"申請履歴",notifications:"通知",files:"ファイル管理",logout:"ログアウト",pending:"承認待ち",approved:"承認",rejected:"否決",all:"すべて",search:"検索",save:"保存",close:"閉じる",approve:"承認",reject:"否決",edit:"編集",archive:"アーカイブ",markRead:"既読にする",reason:"否決理由",submit:"申請する",type:"申請種別",created:"申請日時",amount:"金額",status:"状態",route:"承認経路",profile:"プロフィール",budget:"予算管理",approvedTotal:"承認済み合計",remaining:"残予算",noData:"データがありません",invalidCredentials:"ユーザー名またはパスワードが正しくありません。",registrationSuccess:"アカウントを作成しました。ログインしてください。",usernameTaken:"そのUsernameはすでに使用されています。",passwordMismatch:"Passwordが一致しません。",requiredError:"すべての必須項目を入力してください。",invalidEmail:"有効なEmailを入力してください。",reasonRequired:"否決理由を入力してください。",confirmArchive:"アーカイブしますか？"};
const E={system:"Workflow Hub",loginSub:"Sign in with your username and password.",registerSub:"Register an employee or manager account.",login:"Login",create:"Create Account",username:"Username",password:"Password",confirm:"Confirm Password",name:"Name",email:"Email",department:"Department",position:"Position",accountType:"Account Type",employee:"Employee",manager:"Manager",demo:"Demo: employee / 1234 ・ manager / 1234",dashboard:"Dashboard",newApp:"New Request",myApps:"My Requests",approvals:"Approvals",employees:"Employees",history:"History",notifications:"Notifications",files:"Files",logout:"Logout",pending:"Pending",approved:"Approved",rejected:"Rejected",all:"All",search:"Search",save:"Save",close:"Close",approve:"Approve",reject:"Reject",edit:"Edit",archive:"Archive",markRead:"Mark as read",reason:"Rejection reason",submit:"Submit",type:"Request type",created:"Created",amount:"Amount",status:"Status",route:"Approval route",profile:"Profile",budget:"Budget",approvedTotal:"Approved total",remaining:"Remaining budget",noData:"No data",invalidCredentials:"Incorrect username or password.",registrationSuccess:"Account created successfully. Please log in.",usernameTaken:"That username is already in use.",passwordMismatch:"Passwords do not match.",requiredError:"Please complete all required fields.",invalidEmail:"Please enter a valid email.",reasonRequired:"Please enter a rejection reason.",confirmArchive:"Archive this request?"};
let lang=localStorage.getItem("workflowHub_lang")||"ja",me=null,page="dashboard",apps=[],notifications=[],users=[],files=[],types=[];const t=k=>(lang==="ja"?J:E)[k]||J[k]||k,esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=x=>"¥"+Number(x||0).toLocaleString(),fmt=x=>new Date(x).toLocaleString(lang==="ja"?"ja-JP":"en-US",{dateStyle:"medium",timeStyle:"short"}),typeObj=id=>types.find(x=>x.id===id)||{ja:id,en:id,route:[]},typeName=id=>typeObj(id)[lang],badge=s=>`<span class="status ${s}">${t(s)}</span>`;
async function api(url,opt={}){let r=await fetch(url,{credentials:"same-origin",...opt}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||r.status);return d}
function authText(mode){document.documentElement.lang=lang;let a={authTitle:"system",authSub:mode==="login"?"loginSub":"registerSub",loginTab:"login",regTab:"create",lu:"username",lp:"password",rn:"name",ru:"username",rp:"password",rc:"confirm",re:"email",rd:"department",rpo:"position",rr:"accountType",loginBtn:"login",regBtn:"create",demo:"demo"};Object.entries(a).forEach(([id,k])=>{let e=document.getElementById(id);if(e)e.textContent=t(k)});rRole.options[0].text=t("employee");rRole.options[1].text=t("manager");authLang.textContent=lang==="ja"?"English":"日本語"}
function showAuth(mode){loginForm.classList.toggle("hidden",mode!=="login");registerForm.classList.toggle("hidden",mode!=="register");loginTab.classList.toggle("active",mode==="login");regTab.classList.toggle("active",mode==="register");authText(mode);authMsg.innerHTML=""}
function toggleLang(){lang=lang==="ja"?"en":"ja";localStorage.setItem("workflowHub_lang",lang);if(app.classList.contains("hidden"))authText(registerForm.classList.contains("hidden")?"login":"register");else{renderNav();render()}}
loginForm.onsubmit=async e=>{e.preventDefault();try{let d=await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:loginUser.value.trim(),password:loginPass.value})});me=d.user;await loadData();openApp()}catch{authMsg.innerHTML=`<div class="msg err">${t("invalidCredentials")}</div>`}};
registerForm.onsubmit=async e=>{e.preventDefault();let p={name:rName.value.trim(),username:rUser.value.trim(),password:rPass.value,email:rEmail.value.trim(),department:rDept.value.trim(),position:rPosition.value.trim(),role:rRole.value};if(!Object.values(p).every(Boolean))return authMsg.innerHTML=`<div class="msg err">${t("requiredError")}</div>`;if(p.password!==rPass2.value)return authMsg.innerHTML=`<div class="msg err">${t("passwordMismatch")}</div>`;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email))return authMsg.innerHTML=`<div class="msg err">${t("invalidEmail")}</div>`;try{await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});showAuth("login");authMsg.innerHTML=`<div class="msg ok">${t("registrationSuccess")}</div>`}catch(e){authMsg.innerHTML=`<div class="msg err">${e.message==="USERNAME_TAKEN"?t("usernameTaken"):e.message}</div>`}};
async function loadData(){let [a,n,ty,f]=await Promise.all([api("/api/applications"),api("/api/notifications"),api("/api/types"),api("/api/files")]);apps=a.applications;notifications=n.notifications;types=ty.types;files=f.files;if(me.role==="manager")users=(await api("/api/users")).users}
function openApp(){loginScreen.classList.add("hidden");app.classList.remove("hidden");userBadge.textContent=me.name;sideName.textContent=me.name;sideRole.textContent=me.role==="manager"?t("manager"):t("employee");sideDept.textContent=me.department;renderNav();render()}
async function logout(){try{await api("/api/auth/logout",{method:"POST"})}finally{location.reload()}}
function renderNav(){let x=[["dashboard","dashboard"],["new","newApp"],["my","myApps"],["history","history"],["notifications","notifications"],["files","files"]];if(me.role==="manager")x.splice(3,0,["approvals","approvals"],["employees","employees"]);nav.innerHTML=x.map(([id,k])=>`<button class="${page===id?"active":""}" onclick="go('${id}')">${t(k)}${id==="notifications"?` (${notifications.filter(n=>!n.read_at).length})`:""}</button>`).join("");langBtn.textContent=lang==="ja"?"English":"日本語";logoutBtn.textContent=t("logout")}
function go(p){page=p;renderNav();render()};function head(a,b=""){return `<div class="page-head"><div><h2>${a}</h2><div class="muted">${b}</div></div></div>`}
function render(){({dashboard:dash,new:newReq,my:myReq,approvals:approvals,employees:employees,history:history,notifications:notifs,files:filePage}[page]||dash)()}
function dash(){let mine=apps.filter(a=>a.applicant_id===me.id),pending=apps.filter(a=>a.status==="pending"),approved=apps.filter(a=>a.status==="approved"),total=approved.reduce((s,a)=>s+Number(a.amount||0),0),un=notifications.filter(n=>!n.read_at).length;main.innerHTML=head(t("dashboard"))+`<div class="cards"><div class="card"><div class="muted">${t("myApps")}</div><div class="metric">${mine.length}</div></div><div class="card"><div class="muted">${t("pending")}</div><div class="metric">${pending.length}</div></div><div class="card"><div class="muted">${t("approvedTotal")}</div><div class="metric">${money(total)}</div></div><div class="card"><div class="muted">${t("notifications")}</div><div class="metric">${un}</div></div></div><div class="grid2"><div class="card"><h3>${t("myApps")}</h3>${mine.slice(0,6).map(a=>`<div class="notice"><b>${esc(typeName(a.type))}</b> ${badge(a.status)}<br><span class="small muted">${fmt(a.created_at)}</span></div>`).join("")||`<div class="empty">${t("noData")}</div>`}</div><div class="card"><h3>${t("budget")}</h3><div class="metric">${money(total)}</div><p>${t("remaining")}: <b>${money(5000000-total)}</b></p></div></div>`}
function newReq(){main.innerHTML=head(t("newApp"))+`<div class="card"><form id="af"><div class="form-section"><h4>${t("profile")}</h4><div class="row"><div><label>${t("name")}</label><input id="fName" value="${esc(me.name)}" required></div><div><label>${t("email")}</label><input id="fEmail" value="${esc(me.email||"")}"></div></div><div class="row"><div><label>${t("department")}</label><input id="fDept" value="${esc(me.department||"")}" required></div><div><label>${t("position")}</label><input id="fPos" value="${esc(me.position||"")}"></div></div></div><div class="form-section"><h4>${t("type")}</h4><select id="fType" onchange="drawFields()">${types.map(x=>`<option value="${x.id}">${esc(x[lang])}</option>`).join("")}</select><div id="dyn"></div></div><div class="form-section"><h4>${t("route")}</h4><div id="route"></div></div><button class="btn primary">${t("submit")}</button></form></div>`;drawFields();af.onsubmit=submit}
function inp(id,label,type="text",req=false){return `<div><label>${label}${req?" *":""}</label><input id="v_${id}" type="${type}" ${req?"required":""}></div>`}
function drawFields(){let id=fType.value,x=typeObj(id),s="";const L=(ja,en)=>lang==="ja"?ja:en;if(id==="expense")s=`<div class="row">${inp("purpose",L("用途","Purpose"),"text",true)}${inp("amount",t("amount"),"number",true)}</div>${inp("attachment",L("参考資料・添付情報","Reference / attachment"),"text",true)}`;if(id==="recruit")s=`<div class="row">${inp("office",L("採用予定オフィス","Planned office"),"text",true)}${inp("job",L("職種","Position"),"text",true)}</div>${inp("candidate",L("採用予定者氏名","Candidate name"),"text",true)}`;if(id==="loan")s=`<div class="row">${inp("date",L("融資希望日","Loan date"),"date",true)}${inp("amount",t("amount"),"number",true)}</div>${inp("repay",L("返済回数","Repayment count"),"number",true)}`;if(id==="referral")s=`<div class="row">${inp("candidate",L("紹介採用者氏名","Candidate name"),"text",true)}${inp("start",L("入社日","Start date"),"date",true)}</div>${inp("reward",L("報奨額","Reward"),"number",true)}`;if(id==="marriage"||id==="birth")s=`<div class="row">${inp("date",id==="marriage"?L("婚姻日","Marriage date"):L("出産日","Birth date"),"date",true)}${inp("documents",L("証明書類","Supporting documents"),"text",true)}</div>`;if(id==="cash")s=`<div class="row">${inp("customer",L("お客様名","Customer"),"text",true)}${inp("product",L("商品名","Product"),"text",true)}</div><div class="row">${inp("vendor",L("発注先","Vendor"),"text",true)}${inp("price",L("販売価格","Sales price"),"number",true)}</div><label>${L("支払方法","Payment method")}</label><select id="v_payment" required><option>振込</option><option>現金</option><option>口座引落</option><option>割賦（ビジネスローン）</option></select>`;if(id==="transfer")s=`<div class="row">${inp("target",L("対象者","Employee"),"text",true)}${inp("reason",L("理由","Reason"),"text",true)}</div>`;if(id==="consult")s=`${inp("destination",L("希望先","Preferred destination"),"text",true)}${inp("reason",L("理由","Reason"))}`;if(id==="training")s=`<div class="row">${inp("purpose",L("OFF-JT受講目的","OFF-JT purpose"),"text",true)}${inp("date",L("予定日","Planned date"),"date",true)}</div><div class="row">${inp("overnight",L("宿泊","Overnight"),"text",true)}${inp("people",L("人数","People"),"number",true)}</div>${inp("amount",L("予算額","Budget"),"number",true)}`;dyn.innerHTML=s;route.innerHTML=x.route.map((r,i)=>`<span class="tag">${i+1}. ${esc(r)}</span>`).join(" → ")}
function collect(){let o={};document.querySelectorAll("#dyn input,#dyn select").forEach(e=>o[e.id.slice(2)]=e.value);return o}
async function submit(e){e.preventDefault();let p=collect(),type=fType.value,amount=Number(p.amount||p.price||0);if(type==="loan"&&(amount>200000||Number(p.repay)>30))return alert(lang==="ja"?"社内融資は個人20万円・返済30回以内です。":"Loans are limited to ¥200,000 and 30 repayments.");try{await api("/api/applications",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,payload:{...p,name:fName.value,email:fEmail.value,department:fDept.value,position:fPos.value},amount})});alert(lang==="ja"?"申請を送信しました。":"Request submitted.");await loadData();go("my")}catch(e){alert(e.message)}}
function appTable(arr,manager=false){if(!arr.length)return `<div class="empty">${t("noData")}</div>`;return `<div class="table-wrap"><table><thead><tr><th>${t("type")}</th><th>${t("name")}</th><th>${t("department")}</th><th>${t("amount")}</th><th>${t("status")}</th><th>${t("created")}</th><th>Actions</th></tr></thead><tbody>${arr.map(a=>`<tr><td>${esc(typeName(a.type))}</td><td>${esc(a.applicant_name||"")}</td><td>${esc(a.department||"")}</td><td>${money(a.amount)}</td><td>${badge(a.status)}${a.rejection_reason?`<br><span class="small danger-text">${esc(a.rejection_reason)}</span>`:""}</td><td>${fmt(a.created_at)}</td><td><div class="actions"><button class="btn secondary" onclick="viewApp(${a.id})">${t("close")}</button>${manager&&a.status==="pending"?`<button class="btn success" onclick="approve(${a.id})">${t("approve")}</button><button class="btn danger" onclick="reject(${a.id})">${t("reject")}</button>`:""}${a.applicant_id===me.id&&a.status==="rejected"?`<button class="btn secondary" onclick="editRejected(${a.id})">${t("edit")}</button>`:""}<button class="btn warning" onclick="archiveApp(${a.id})">${t("archive")}</button></div></td></tr>`).join("")}</tbody></table></div>`}
function myReq(){main.innerHTML=head(t("myApps"))+`<div class="toolbar"><input id="search" placeholder="${t("search")}" oninput="filterMy()"><select id="filter"><option value="">${t("all")}</option><option value="pending">${t("pending")}</option><option value="approved">${t("approved")}</option><option value="rejected">${t("rejected")}</option></select></div><div id="mt">${appTable(apps)}</div>`;filter.onchange=filterMy}
function filterMy(){let q=(search?.value||"").toLowerCase(),s=filter?.value||"";mt.innerHTML=appTable(apps.filter(a=>(!s||a.status===s)&&(`${typeName(a.type)} ${a.applicant_name}`.toLowerCase().includes(q))))}
function approvals(){main.innerHTML=head(t("approvals"))+`<div class="card">${appTable(apps.filter(a=>a.status==="pending"),true)}</div>`}
function history(){main.innerHTML=head(t("history"))+`<div class="card">${appTable(apps)}</div>`}
function employees(){main.innerHTML=head(t("employees"))+`<div class="card"><div class="toolbar"><input id="uq" placeholder="${t("search")}" oninput="filterUsers()"></div><div id="ut">${userTable(users)}</div></div>`}
function userTable(a){return `<div class="table-wrap"><table><thead><tr><th>ID</th><th>${t("name")}</th><th>Username</th><th>${t("department")}</th><th>${t("position")}</th><th>${t("email")}</th><th>Role</th></tr></thead><tbody>${a.map(u=>`<tr><td>${esc(u.public_id)}</td><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.department)}</td><td>${esc(u.position)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td></tr>`).join("")}</tbody></table></div>`}function filterUsers(){let q=(uq?.value||"").toLowerCase();ut.innerHTML=userTable(users.filter(u=>`${u.name} ${u.username} ${u.department} ${u.position}`.toLowerCase().includes(q)))}
function notifs(){main.innerHTML=head(t("notifications"))+`<div class="card">${notifications.map(n=>`<div class="notice ${n.read_at?"":"unread"}"><b>${esc(n.title)}</b><br>${esc(n.body)}<br><span class="small muted">${fmt(n.created_at)}</span>${!n.read_at?` <button class="linkbtn" onclick="readN(${n.id})">${t("markRead")}</button>`:""}</div>`).join("")||`<div class="empty">${t("noData")}</div>`}</div>`}async function readN(id){await api(`/api/notifications/${id}/read`,{method:"POST"});await loadData();renderNav();render()}
function filePage(){main.innerHTML=head(t("files"))+`<div class="card"><form id="ff"><input id="file" type="file" required><button class="btn primary">${t("save")}</button></form></div><div class="card" style="margin-top:14px">${files.map(f=>`<div class="notice"><b>${esc(f.original_name)}</b> — <a href="/uploads/${encodeURIComponent(f.stored_name)}" target="_blank">Open</a><br><span class="small muted">${esc(f.owner_name||"")} ・ ${fmt(f.created_at)}</span></div>`).join("")||`<div class="empty">${t("noData")}</div>`}</div>`;ff.onsubmit=uploadFile}async function uploadFile(e){e.preventDefault();let fd=new FormData();fd.append("file",file.files[0]);try{await api("/api/files",{method:"POST",body:fd});await loadData();filePage()}catch(e){alert(e.message)}}
function viewApp(id){let a=apps.find(x=>x.id===id);if(!a)return;modalBox.innerHTML=`<div class="modal-head"><h3>${esc(typeName(a.type))}</h3><button class="close" onclick="closeModal()">×</button></div><p>${badge(a.status)}　<span class="muted">${fmt(a.created_at)}</span></p><div class="form-section"><b>${t("name")}</b><p>${esc(a.applicant_name||"")} / ${esc(a.department||"")} / ${esc(a.position||"")} / ${esc(a.email||"")}</p></div><div class="form-section">${Object.entries(a.payload||{}).map(([k,v])=>`<p><span class="muted">${esc(k)}</span><br>${esc(v)||"—"}</p>`).join("")}</div><div class="form-section"><b>${t("route")}</b><p>${typeObj(a.type).route.map((r,i)=>`${i+1}. ${esc(r)}`).join(" → ")}</p></div><div class="actions">${a.status==="pending"&&me.role==="manager"?`<button class="btn success" onclick="approve(${a.id})">${t("approve")}</button><button class="btn danger" onclick="reject(${a.id})">${t("reject")}</button>`:""}</div>`;modal.classList.remove("hidden")}function closeModal(){modal.classList.add("hidden")}
async function approve(id){if(!confirm(lang==="ja"?"承認しますか？":"Approve this request?"))return;await api(`/api/applications/${id}/approve`,{method:"POST"});closeModal();await loadData();render()}async function reject(id){modalBox.innerHTML=`<div class="modal-head"><h3>${t("reject")}</h3><button class="close" onclick="closeModal()">×</button></div><label>${t("reason")}</label><textarea id="reason"></textarea><button class="btn danger" onclick="confirmReject(${id})">${t("reject")}</button>`;modal.classList.remove("hidden")}async function confirmReject(id){let r=reason.value.trim();if(!r)return alert(t("reasonRequired"));await api(`/api/applications/${id}/reject`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:r})});closeModal();await loadData();render()}async function archiveApp(id){if(!confirm(t("confirmArchive")))return;await api(`/api/applications/${id}`,{method:"DELETE"});await loadData();render()}
function editRejected(id){let a=apps.find(x=>x.id===id);modalBox.innerHTML=`<div class="modal-head"><h3>${t("edit")}</h3><button class="close" onclick="closeModal()">×</button></div>${Object.entries(a.payload||{}).map(([k,v])=>`<label>${esc(k)}</label><input data-ek="${esc(k)}" value="${esc(v)}">`).join("")}<button class="btn primary" onclick="saveEdit(${id})">${t("save")}</button>`;modal.classList.remove("hidden")}async function saveEdit(id){let p={};document.querySelectorAll("[data-ek]").forEach(e=>p[e.dataset.ek]=e.value);await api(`/api/applications/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({payload:p,amount:Number(p.amount||p.price||0)})});closeModal();await loadData();render()}
(async()=>{authText("login");try{me=(await api("/api/me")).user;await loadData();openApp()}catch{}})();
</script></body></html>
