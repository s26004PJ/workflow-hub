<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow Hub</title>

<style>
:root{
  --navy:#13233f;
  --blue:#2563eb;
  --sky:#eaf2ff;
  --green:#15803d;
  --red:#b91c1c;
  --amber:#b45309;
  --bg:#f5f7fb;
  --card:#fff;
  --line:#dbe2ea;
  --text:#172033;
  --muted:#667085;
  --radius:14px
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,"Noto Sans JP",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{
  height:64px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20
}
.brand{font-weight:800;letter-spacing:.02em}
.top-actions{display:flex;gap:8px;align-items:center}
.top button{
  border:1px solid #ffffff40;
  background:#ffffff12;
  color:#fff;
  padding:8px 12px;
  border-radius:9px
}

.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:linear-gradient(135deg,#eef4ff,#f8fafc)
}
.auth{
  width:min(460px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:30px;
  box-shadow:0 18px 50px #10203b18
}
.auth h1{margin:0 0 6px}
.auth p{color:var(--muted);margin:0 0 22px}

.tabs{
  display:flex;
  background:#f1f5f9;
  padding:4px;
  border-radius:10px;
  margin-bottom:18px
}
.tabs button{
  flex:1;
  border:0;
  background:transparent;
  padding:10px;
  border-radius:8px
}
.tabs .active{
  background:#fff;
  box-shadow:0 1px 5px #0001;
  font-weight:700
}

label{
  display:block;
  font-weight:650;
  font-size:13px;
  margin:12px 0 6px
}
input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 11px;
  background:#fff;
  color:var(--text)
}
textarea{min-height:88px;resize:vertical}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700
}
.primary{background:var(--blue);color:#fff}
.secondary{background:#eef2f7;color:var(--text)}
.danger{background:#fee2e2;color:var(--red)}
.success{background:#dcfce7;color:var(--green)}
.warning{background:#fef3c7;color:var(--amber)}
.linkbtn{
  border:0;
  background:none;
  color:var(--blue);
  font-weight:700;
  padding:5px
}
.auth .btn{width:100%;margin-top:16px}

.msg{
  padding:10px 12px;
  border-radius:9px;
  margin:12px 0;
  font-size:13px
}
.msg.err{background:#fee2e2;color:#991b1b}
.msg.ok{background:#dcfce7;color:#166534}

.layout{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:calc(100vh - 64px)
}
aside{
  background:#fff;
  border-right:1px solid var(--line);
  padding:16px;
  position:sticky;
  top:64px;
  height:calc(100vh - 64px)
}
nav button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  padding:11px 12px;
  border-radius:9px;
  margin:2px 0;
  color:#334155
}
nav button.active,
nav button:hover{
  background:var(--sky);
  color:#1745a0;
  font-weight:700
}
.side-user{
  padding:12px;
  background:#f8fafc;
  border-radius:10px;
  margin-bottom:14px;
  font-size:13px
}

.content{
  padding:24px;
  max-width:1500px;
  width:100%;
  margin:auto
}
.page-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
  margin-bottom:18px
}
.page-head h2{margin:0 0 5px}
.muted{color:var(--muted)}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:17px
}
.metric{
  font-size:27px;
  font-weight:800;
  margin-top:5px
}
.grid2{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:16px
}

.table-wrap{
  overflow:auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius)
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:720px
}
th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px;
  vertical-align:top
}
th{
  background:#f8fafc;
  font-size:12px;
  color:#475467
}
tr:last-child td{border-bottom:0}

.status{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800
}
.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.archived{background:#e5e7eb;color:#374151}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}
.actions .btn{
  padding:7px 9px;
  font-size:12px
}
.notice{
  border-left:4px solid var(--blue);
  background:#eff6ff;
  padding:12px;
  border-radius:8px;
  margin:8px 0
}
.notice.unread{
  border-left-color:#ef4444;
  background:#fff7f7
}

.modal{
  position:fixed;
  inset:0;
  background:#0b122066;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:50
}
.modal-box{
  background:#fff;
  border-radius:16px;
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  padding:22px
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}
.close{
  border:0;
  background:#eef2f7;
  border-radius:50%;
  width:34px;
  height:34px
}
.form-section{
  border:1px solid var(--line);
  padding:14px;
  border-radius:11px;
  margin:12px 0
}
.form-section h4{margin:0 0 8px}
.tag{
  display:inline-block;
  background:#eef2ff;
  color:#3730a3;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  margin:2px
}
.empty{
  padding:30px;
  text-align:center;
  color:var(--muted)
}
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px
}
.toolbar input,
.toolbar select{
  width:auto;
  min-width:150px
}
.file-row{
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--line)
}
.small{font-size:12px}
.danger-text{color:var(--red)}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{
    position:static;
    height:auto;
    border-right:0;
    border-bottom:1px solid var(--line)
  }
  nav{
    display:flex;
    overflow:auto
  }
  nav button{min-width:max-content}
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}

@media(max-width:600px){
  .top{padding:0 12px}
  .content{padding:15px}
  .cards{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:1fr}
  .auth{padding:22px}
  .page-head{flex-direction:column}
}
</style>
</head>

<body>

<div id="loginScreen" class="login-wrap">
  <div class="auth">

    <h1 id="authTitle">社内ワークフロー</h1>
    <p id="authSub">Username と Password でログインしてください。</p>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showAuth('login')">
        ログイン
      </button>
      <button id="regTab" onclick="showAuth('register')">
        アカウントを作成
      </button>
    </div>

    <div id="authMsg"></div>

    <form id="loginForm">
      <label>Username</label>
      <input id="loginUser" autocomplete="username" required>

      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" required>

      <button class="btn primary">ログイン</button>

      <div class="small muted" style="margin-top:15px">
        Demo: employee / 1234　・　manager / 1234
      </div>
    </form>

    <form id="registerForm" class="hidden">

      <div class="row">
        <div>
          <label>氏名</label>
          <input id="rName" required>
        </div>
        <div>
          <label>Username</label>
          <input id="rUser" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Password</label>
          <input id="rPass" type="password" required>
        </div>
        <div>
          <label>Password（確認）</label>
          <input id="rPass2" type="password" required>
        </div>
      </div>

      <label>Email</label>
      <input id="rEmail" type="email" required>

      <div class="row">
        <div>
          <label>部署</label>
          <input id="rDept" required placeholder="営業部">
        </div>
        <div>
          <label>役職</label>
          <input id="rPosition" required placeholder="一般社員">
        </div>
      </div>

      <label>アカウント種別</label>
      <select id="rRole">
        <option value="employee">Employee / 社員</option>
        <option value="manager">Manager / 管理者</option>
      </select>

      <button class="btn primary">アカウントを作成</button>

      <p class="small muted" style="margin-top:12px">
        登録後は自動ログインせず、ログイン画面へ戻ります。
      </p>
    </form>

  </div>
</div>

<div id="app" class="hidden">

<header class="top">
  <div class="brand">WORKFLOW HUB</div>

  <div class="top-actions">
    <span id="userBadge"></span>
    <button onclick="toggleLang()" id="langBtn">English</button>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="layout">

<aside>
  <div class="side-user">
    <b id="sideName"></b><br>
    <span id="sideRole" class="muted"></span><br>
    <span id="sideDept" class="muted"></span>
  </div>

  <nav id="nav"></nav>
</aside>

<main class="content" id="main"></main>

</div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
"use strict";

const KEY="workflowHub_v4";
const SESSION="workflowHub_session_v4";

const TYPES=[
  {
    id:"expense",
    ja:"経費使用申請",
    en:"Expense Use Request",
    route:["上長","総務部長・経理部長（いずれか）","代表"]
  },
  {
    id:"recruit",
    ja:"採用申請",
    en:"Recruitment Request",
    route:["上長","代表"]
  },
  {
    id:"loan",
    ja:"社内融資申請",
    en:"Internal Loan Request",
    route:["上長","経理部長","代表","経理（振込）"]
  },
  {
    id:"referral",
    ja:"人材紹介申請",
    en:"Employee Referral Request",
    route:["総務部長","代表"]
  },
  {
    id:"marriage",
    ja:"結婚祝い申請",
    en:"Marriage Celebration Request",
    route:["総務部長","経理部長"]
  },
  {
    id:"birth",
    ja:"出産祝い申請",
    en:"Birth Celebration Request",
    route:["総務部長","経理部長"]
  },
  {
    id:"cash",
    ja:"現金販売申請",
    en:"Cash Sales Request",
    route:["営業統括部長","経理部長"]
  },
  {
    id:"transfer",
    ja:"転勤・転属申請",
    en:"Transfer Request",
    route:["所属部長","統括部長","総務部長","代表"]
  },
  {
    id:"consult",
    ja:"転勤・転属相談",
    en:"Transfer Consultation",
    route:["総務部長"]
  },
  {
    id:"training",
    ja:"研修申請",
    en:"Training Request",
    route:["上長","総務部長","代表"]
  }
];

const TXT={
  ja:{
    dashboard:"ダッシュボード",
    newApp:"新規申請",
    myApps:"自分の申請",
    approvals:"承認待ち",
    employees:"社員管理",
    history:"申請履歴",
    notifications:"通知",
    files:"ファイル管理",
    settings:"設定",
    logout:"ログアウト",
    employee:"社員",
    manager:"管理者",
    pending:"承認待ち",
    approved:"承認",
    rejected:"否決",
    archived:"アーカイブ",
    all:"すべて",
    search:"検索",
    save:"保存",
    cancel:"キャンセル",
    close:"閉じる",
    approve:"承認",
    reject:"否決",
    edit:"編集",
    delete:"削除",
    archive:"アーカイブ",
    restore:"復元",
    permanent:"完全削除",
    markRead:"既読にする",
    reason:"否決理由",
    submit:"申請する",
    name:"氏名",
    department:"部署",
    position:"役職",
    email:"Email",
    type:"申請種別",
    created:"申請日時",
    amount:"金額",
    status:"状態",
    route:"承認経路",
    required:"必須",
    optional:"任意",
    profile:"プロフィール",
    budget:"予算管理",
    approvedTotal:"承認済み合計",
    remaining:"残予算",
    baseBudget:"基準予算",
    noData:"データがありません",
    notificationsHint:"未読通知は確認するまで残ります。",
    confirmDelete:"本当に削除しますか？",
    confirmPermanent:"完全削除すると復元できません。実行しますか？"
  },

  en:{
    dashboard:"Dashboard",
    newApp:"New Request",
    myApps:"My Requests",
    approvals:"Approvals",
    employees:"Employees",
    history:"History",
    notifications:"Notifications",
    files:"Files",
    settings:"Settings",
    logout:"Logout",
    employee:"Employee",
    manager:"Manager",
    pending:"Pending",
    approved:"Approved",
    rejected:"Rejected",
    archived:"Archived",
    all:"All",
    search:"Search",
    save:"Save",
    cancel:"Cancel",
    close:"Close",
    approve:"Approve",
    reject:"Reject",
    edit:"Edit",
    delete:"Delete",
    archive:"Archive",
    restore:"Restore",
    permanent:"Delete Permanently",
    markRead:"Mark as read",
    reason:"Rejection reason",
    submit:"Submit",
    name:"Name",
    department:"Department",
    position:"Position",
    email:"Email",
    type:"Request type",
    created:"Created",
    amount:"Amount",
    status:"Status",
    route:"Approval route",
    required:"Required",
    optional:"Optional",
    profile:"Profile",
    budget:"Budget",
    approvedTotal:"Approved total",
    remaining:"Remaining budget",
    baseBudget:"Budget",
    noData:"No data",
    notificationsHint:"Unread notifications remain until reviewed.",
    confirmDelete:"Delete this item?",
    confirmPermanent:"Permanent deletion cannot be undone. Continue?"
  }
};

let lang=localStorage.getItem("workflowHub_lang")||"ja";
let db=loadDB();
let session=null;
let page="dashboard";

function uid(prefix){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)
}

function loadDB(){

  let d;

  try{
    d=JSON.parse(localStorage.getItem(KEY)||"null")
  }catch(e){}

  if(!d){
    d={
      users:[],
      apps:[],
      notifications:[],
      files:[],
      settings:{budget:5000000}
    };
  }

  if(!d.users.length){
    d.users=[
      {
        id:"U-DEMO-EMP",
        name:"山田 太郎",
        username:"employee",
        password:"1234",
        email:"employee@example.com",
        department:"営業部",
        position:"一般社員",
        role:"employee",
        created:Date.now()
      },
      {
        id:"U-DEMO-MGR",
        name:"佐藤 花子",
        username:"manager",
        password:"1234",
        email:"manager@example.com",
        department:"総務部",
        position:"部長",
        role:"manager",
        created:Date.now()
      }
    ];
  }

  return d;
}

function persist(){
  localStorage.setItem(KEY,JSON.stringify(db))
}

function t(k){
  return TXT[lang][k]||TXT.ja[k]||k
}

function typeObj(id){
  return TYPES.find(x=>x.id===id)||TYPES[0]
}

function typeName(id){
  let x=typeObj(id);
  return x[lang]
}

function current(){
  return db.users.find(u=>u.id===session?.userId)
}

function fmtDate(x){
  return new Date(x).toLocaleString(
    lang==="ja"?"ja-JP":"en-US",
    {dateStyle:"medium",timeStyle:"short"}
  )
}

function money(x){
  return "¥"+Number(x||0).toLocaleString()
}

function esc(x){
  return String(x??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  )
}

function statusBadge(s){
  return `<span class="status ${s}">${t(s)}</span>`
}

function notify(userId,title,body,kind="info"){
  db.notifications.unshift({
    id:uid("N"),
    userId,
    title,
    body,
    created:Date.now(),
    read:false,
    kind
  });

  persist()
}

function showAuth(mode){

  document.getElementById("loginForm")
    .classList.toggle("hidden",mode!=="login");

  document.getElementById("registerForm")
    .classList.toggle("hidden",mode!=="register");

  document.getElementById("loginTab")
    .classList.toggle("active",mode==="login");

  document.getElementById("regTab")
    .classList.toggle("active",mode==="register");

  document.getElementById("authTitle").textContent=
    mode==="login"?"社内ワークフロー":"アカウントを作成";

  document.getElementById("authSub").textContent=
    mode==="login"
      ?"Username と Password でログインしてください。"
      :"社員・管理者アカウントを登録してください。";

  document.getElementById("authMsg").innerHTML="";
}

document.getElementById("loginForm").onsubmit=e=>{

  e.preventDefault();

  let u=document.getElementById("loginUser").value.trim();
  let p=document.getElementById("loginPass").value;

  let found=db.users.find(
    x=>x.username.toLowerCase()===u.toLowerCase()&&
       x.password===p
  );

  if(!found){
    document.getElementById("authMsg").innerHTML=
      `<div class="msg err">
        Username または Password が正しくありません。
      </div>`;
    return
  }

  session={
    userId:found.id,
    role:found.role,
    loginAt:Date.now()
  };

  localStorage.setItem(SESSION,JSON.stringify(session));
  openApp()
};

document.getElementById("registerForm").onsubmit=e=>{

  e.preventDefault();

  let name=rName.value.trim();
  let username=rUser.value.trim();
  let p=rPass.value;
  let p2=rPass2.value;
  let email=rEmail.value.trim();
  let dept=rDept.value.trim();
  let pos=rPosition.value.trim();
  let role=rRole.value;

  if(!name||!username||!p||!p2||!email||!dept||!pos){
    return regMsg("すべての必須項目を入力してください。")
  }

  if(
    db.users.some(
      u=>u.username.toLowerCase()===username.toLowerCase()
    )
  ){
    return regMsg("そのUsernameはすでに使用されています。")
  }

  if(p!==p2){
    return regMsg("Passwordが一致しません。")
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    return regMsg("有効なEmailを入力してください。")
  }

  db.users.push({
    id:uid("U"),
    name,
    username,
    password:p,
    email,
    department:dept,
    position:pos,
    role,
    created:Date.now()
  });

  persist();
  showAuth("login");

  document.getElementById("authMsg").innerHTML=
    `<div class="msg ok">
      アカウントを作成しました。Username と Password でログインしてください。
    </div>`;
};

function regMsg(s){
  document.getElementById("authMsg").innerHTML=
    `<div class="msg err">${esc(s)}</div>`
}

function openApp(){

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  const u=current();

  if(!u){
    logout();
    return
  }

  document.getElementById("userBadge").textContent=u.name;
  document.getElementById("sideName").textContent=u.name;

  document.getElementById("sideRole").textContent=
    u.role==="manager"?t("manager"):t("employee");

  document.getElementById("sideDept").textContent=u.department;

  renderNav();
  render()
}

function logout(){

  session=null;
  localStorage.removeItem(SESSION);

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginScreen")
    .classList.remove("hidden");

  showAuth("login");

  document.getElementById("loginUser").value="";
  document.getElementById("loginPass").value=""
}

function toggleLang(){

  lang=lang==="ja"?"en":"ja";

  localStorage.setItem("workflowHub_lang",lang);

  renderNav();
  render()
}

function renderNav(){

  const items=[
    ["dashboard","dashboard"],
    ["new","newApp"],
    ["my","myApps"],
    ["history","history"],
    ["notifications","notifications"],
    ["files","files"]
  ];

  if(current().role==="manager"){
    items.splice(
      3,
      0,
      ["approvals","approvals"],
      ["employees","employees"]
    );
  }

  document.getElementById("nav").innerHTML=
    items.map(([id,key])=>
      `<button class="${page===id?'active':''}"
        onclick="go('${id}')">
        ${t(key)}
        ${
          id==="notifications"
            ?` (${db.notifications.filter(
                n=>n.userId===current().id&&!n.read
              ).length})`
            :""
        }
      </button>`
    ).join("");

  document.getElementById("langBtn").textContent=
    lang==="ja"?"English":"日本語";
}

function go(p){
  page=p;
  renderNav();
  render()
}

function render(){

  try{

    let m=document.getElementById("main");

    ({
      dashboard:renderDashboard,
      new:renderNew,
      my:renderMy,
      approvals:renderApprovals,
      employees:renderEmployees,
      history:renderHistory,
      notifications:renderNotifications,
      files:renderFiles
    }[page]||renderDashboard)(m)

  }catch(e){

    console.error(e);

    document.getElementById("main").innerHTML=
      `<div class="card">
        <b>表示エラー</b>
        <p class="muted">${esc(e.message)}</p>
        <button class="btn secondary" onclick="render()">

}

function collectFields(){

  const obj={};

  document
    .querySelectorAll(
      "#dynamicFields input,#dynamicFields select,#dynamicFields textarea"
    )
    .forEach(el=>{
      obj[
        el.id.replace(/^v_/,"")
      ]=el.value
    });

  return obj
}

function validateSpecial(type,v){

  if(
    type==="loan" &&
    (
      Number(v.amount)>200000 ||
      Number(v.repay)>30
    )
  ){
    return "社内融資は個人20万円・返済30回以内です。"
  }

  if(type==="cash"){

    let p=Number(v.price);

    if(
      p<300000 &&
      !["振込","現金","口座引落"].includes(v.payment)
    ){
      return "30万円未満の支払方法を確認してください。"
    }

    if(
      p>=300000 &&
      p<1000000 &&
      !["振込","割賦（ビジネスローン）","口座引落"].includes(v.payment)
    ){
      return "30万〜100万円未満の支払方法を確認してください。"
    }

    if(
      p>=1000000 &&
      !["振込","割賦（ビジネスローン）"].includes(v.payment)
    ){
      return "100万円以上の支払方法を確認してください。"
    }
  }

  return ""
}

function submitApp(e){

  e.preventDefault();

  const u=current();
  const type=fType.value;
  const v=collectFields();

  const err=validateSpecial(type,v);

  if(err){
    alert(err);
    return
  }

  let amount=Number(v.amount||v.price||0);

  const a={
    id:uid("A"),
    applicantId:u.id,
    applicantName:fName.value.trim(),
    email:fEmail.value.trim(),
    department:fDept.value.trim(),
    position:fPos.value.trim(),
    type,
    data:v,
    amount,
    status:"pending",
    created:Date.now(),
    updated:Date.now(),
    archived:false,
    approvalIndex:0,
    rejectionReason:""
  };

  db.apps.unshift(a);

  db.users
    .filter(x=>x.role==="manager")
    .forEach(m=>
      notify(
        m.id,
        "新しい承認依頼",
        `${a.applicantName}さんの「${typeName(type)}」が承認待ちです。`,
        "approval"
      )
    );

  persist();

  alert("申請を送信しました。承認者へ通知しました。");

  go("my")
}

function appActions(a,manager=false){

  let out=
    `<button class="btn secondary"
      onclick="viewApp('${a.id}')">
      詳細
    </button>`;

  if(
    manager &&
    a.status==="pending" &&
    !a.archived
  ){
    out+=
      `<button class="btn success"
        onclick="approveApp('${a.id}')">
        ${t("approve")}
      </button>

      <button class="btn danger"
        onclick="rejectApp('${a.id}')">
        ${t("reject")}
      </button>`;
  }

  if(
    a.applicantId===current().id &&
    !a.archived &&
    (
      a.status==="pending" ||
      a.status==="rejected"
    )
  ){
    out+=
      `<button class="btn secondary"
        onclick="editApp('${a.id}')">
        ${t("edit")}
      </button>`;
  }

  if(a.archived){
    out+=
      `<button class="btn secondary"
        onclick="restoreApp('${a.id}')">
        ${t("restore")}
      </button>`;
  }else{
    out+=
      `<button class="btn warning"
        onclick="archiveApp('${a.id}')">
        ${t("archive")}
      </button>`;
  }

  if(a.archived){
    out+=
      `<button class="btn danger"
        onclick="permDelete('${a.id}')">
        ${t("permanent")}
      </button>`;
  }

  return out
}

function approveApp(id){

  const a=db.apps.find(x=>x.id===id);

  if(
    !a ||
    current().role!=="manager"
  )return;

  a.status="approved";
  a.updated=Date.now();
  a.approverId=current().id;
  a.approvalIndex=typeObj(a.type).route.length;

  persist();

  notify(
    a.applicantId,
    "申請が承認されました",
    `「${typeName(a.type)}」が承認されました。`,
    "result"
  );

  if(a.type==="loan"){
    db.users
      .filter(
        x=>x.department.includes("経理")
      )
      .forEach(
        x=>
          notify(
            x.id,
            "振込担当への通知",
            "社内融資の承認が完了しました。振込対応を確認してください。",
            "payment"
          )
      );
  }

  persist();
  closeModal();
  render()
}

      class="btn danger"
      style="margin-top:12px"
      onclick="confirmReject('${id}')">

      ${t("reject")}

    </button>
    `;

  document.getElementById("modal")
    .classList.remove("hidden")
}

function confirmReject(id){

  const reason=
    document.getElementById("rejectReason")
      .value.trim();

  if(!reason){
    alert("否決理由を入力してください。");
    return
  }

  const a=db.apps.find(x=>x.id===id);

  if(!a)return;

  a.status="rejected";
  a.rejectionReason=reason;
  a.updated=Date.now();

  persist();

  notify(
    a.applicantId,
    "申請が否決されました",
    `「${typeName(a.type)}」を修正して再申請できます。理由: ${reason}`,
    "result"
  );

  persist();
  closeModal();
  render()
}

function editApp(id){

  const a=db.apps.find(x=>x.id===id);

  if(
    !a ||
    a.applicantId!==current().id
  )return;

  document.getElementById("modalBox").innerHTML=
    `
    <div class="modal-head">

      <h3>${t("edit")}</h3>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <p class="muted">
      申請内容とプロフィール値は編集・消去できます。
    </p>

    <label>${t("name")}</label>
    <input
      id="eName"
      value="${esc(a.applicantName)}">

    <label>${t("email")}</label>
    <input
      id="eEmail"
      value="${esc(a.email)}">

    <label>${t("department")}</label>
    <input
      id="eDept"
      value="${esc(a.department)}">

    <label>${t("position")}</label>
    <input
      id="ePos"
      value="${esc(a.position)}">

    <div class="form-section">

      ${
        Object.entries(a.data||{})
          .map(
            ([k,v])=>
              `
              <label>${esc(k)}</label>
              <input
                data-ek="${esc(k)}"
                value="${esc(v)}">
              `
          ).join("")
      }

    </div>

    <button
      class="btn primary"
      onclick="saveEdit('${id}')">

      ${t("save")}

    </button>
    `;

  document.getElementById("modal")
    .classList.remove("hidden")
}

function saveEdit(id){

  const a=db.apps.find(x=>x.id===id);

  if(!a)return;

  a.applicantName=eName.value;
  a.email=eEmail.value;
  a.department=eDept.value;
  a.position=ePos.value;

  document
    .querySelectorAll("[data-ek]")
    .forEach(
      el=>a.data[el.dataset.ek]=el.value
    );

  a.status="pending";
  a.rejectionReason="";
  a.updated=Date.now();

  persist();

  db.users
    .filter(x=>x.role==="manager")
    .forEach(
      m=>
        notify(
          m.id,
          "修正・再申請",
          "修正された申請があります。",
          "approval"
        )
    );

  persist();
  closeModal();
  render()
}

function archiveApp(id){

  const a=db.apps.find(x=>x.id===id);

  if(!a)return;

  if(!confirm("アーカイブしますか？"))return;

  a.archived=true;
  a.updated=Date.now();

  persist();
  render()
}

function restoreApp(id){

  const a=db.apps.find(x=>x.id===id);

  if(!a)return;

  a.archived=false;
  a.updated=Date.now();

  persist();
  render()
}

function permDelete(id){

  if(!confirm(t("confirmPermanent")))return;

  db.apps=db.apps.filter(
    a=>a.id!==id
  );

  persist();
  render()
}

function renderEmployees(m){

  if(current().role!=="manager"){
    return go("dashboard")
  }

  m.innerHTML=
    head(
      t("employees"),
      "社員プロフィールを検索・確認できます"
    )+

    `
    <div class="toolbar">

      <input
        id="empQ"
        placeholder="${t("search")}"
        oninput="employeeTable()">

      <select
        id="empRole"
        onchange="employeeTable()">

        <option value="">${t("all")}</option>
        <option value="employee">${t("employee")}</option>
        <option value="manager">${t("manager")}</option>

      </select>

    </div>

    <div id="employeeTable"></div>
    `;

  employeeTable()
}

function employeeTable(){

  const q=(
    document.getElementById("empQ")?.value||""
  ).toLowerCase();

  const r=
    document.getElementById("empRole")?.value||"";

  const arr=db.users.filter(
    u=>
      (!r||u.role===r) &&
      `${u.name} ${u.username} ${u.department} ${u.position}`
        .toLowerCase()
        .includes(q)
  );

  document.getElementById("employeeTable").innerHTML=
    `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>${t("name")}</th>
            <th>Username</th>
            <th>${t("department")}</th>
            <th>${t("position")}</th>
            <th>${t("email")}</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>

          ${
            arr.map(u=>
              `
              <tr>

                <td>${esc(u.id)}</td>
                <td>${esc(u.name)}</td>
                <td>${esc(u.username)}</td>
                <td>${esc(u.department)}</td>
                <td>${esc(u.position)}</td>
                <td>${esc(u.email)}</td>
                <td>${u.role}</td>

                <td>
                  <button
                    class="btn secondary"
                    onclick="editUser('${u.id}')">
                    ${t("edit")}
                  </button>
                </td>

              </tr>
              `
            ).join("")
          }

        </tbody>

      </table>

    </div>
    `
}

function editUser(id){

  const u=db.users.find(x=>x.id===id);

  if(!u)return;

  document.getElementById("modalBox").innerHTML=
    `
    <div class="modal-head">

      <h3>${t("profile")}</h3>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="row">

      <div>
        <label>${t("name")}</label>
        <input
          id="pName"
          value="${esc(u.name)}">
      </div>

      <div>
        <label>${t("email")}</label>
        <input
          id="pEmail"
          value="${esc(u.email)}">
      </div>

    </div>

    <div class="row">

      <div>
        <label>${t("department")}</label>
        <input
          id="pDept"
          value="${esc(u.department)}">
      </div>

      <div>
        <label>${t("position")}</label>
        <input
          id="pPos"
          value="${esc(u.position)}">
      </div>

    </div>

    <label>Username</label>

    <input
      value="${esc(u.username)}"
      disabled>

    <button
      class="btn primary"
      style="margin-top:15px"
      onclick="saveUser('${id}')">

      ${t("save")}

    </button>
    `;

  document.getElementById("modal")
    .classList.remove("hidden")
}

function saveUser(id){

  let u=db.users.find(x=>x.id===id);

  if(!u)return;

  u.name=pName.value;
  u.email=pEmail.value;
  u.department=pDept.value;
  u.position=pPos.value;

  persist();

  if(u.id===current().id){
    closeModal();
    openApp();
  }else{
    closeModal();
    render()
  }
}

function renderNotifications(m){

  let arr=db.notifications.filter(
    n=>n.userId===current().id
  );

  m.innerHTML=
    head(
      t("notifications"),
      t("notificationsHint"),
      `<button
        class="btn secondary"
        onclick="markAllRead()">
        ${t("markRead")}
      </button>`
    )+

    `
    <div class="card">

      ${
        arr.length
          ?arr.map(
            n=>
              `
              <div class="notice ${n.read?"":"unread"}">

                <b>${esc(n.title)}</b>
                <br>

                ${esc(n.body)}

                <br>

                <span class="small muted">
                  ${fmtDate(n.created)}
                </span>

                ${
                  !n.read
                    ?`
                    <button
                      class="linkbtn"
                      onclick="readOne('${n.id}')">
                      ${t("markRead")}
                    </button>
                    `
                    :""
                }

              </div>
              `
          ).join("")
          :`<div class="empty">${t("noData")}</div>`
      }

    </div>
    `
}

function readOne(id){

  let n=db.notifications.find(
    x=>x.id===id
  );

  if(n)n.read=true;

  persist();
  renderNav();
  render()
}

function markAllRead(){

  db.notifications
    .filter(
      n=>n.userId===current().id
    )
    .forEach(
      n=>n.read=true
    );

  persist();
  renderNav();
  render()
}

function renderFiles(m){

  let mine=db.files.filter(
    f=>
      f.ownerId===current().id ||
      current().role==="manager"
  );

  m.innerHTML=
    head(
      t("files"),
      "添付情報・社内ファイルの整理。"
    )+

    `
    <div class="card">

      <form id="fileForm">

        <div class="row">

          <div>
            <label>ファイル名</label>
            <input id="fileName" required>
          </div>

          <div>
            <label>説明</label>
            <input id="fileDesc">
          </div>

        </div>

        <button class="btn primary">
          ${t("save")}
        </button>

      </form>

    </div>

    <div class="card" style="margin-top:14px">

      ${
        mine.length
          ?mine.map(
            f=>
              `
              <div class="file-row">

                <div style="flex:1">

                  <b>${esc(f.name)}</b>

                  <br>

                  <span class="small muted">
                    ${esc(f.desc||"")}
                    ・
                    ${fmtDate(f.created)}
                  </span>

                </div>

                ${
                  f.archived
                    ?`
                    <button
                      class="btn secondary"
                      onclick="restoreFile('${f.id}')">
                      ${t("restore")}
                    </button>

                    <button
                      class="btn danger"
                      onclick="deleteFile('${f.id}')">
                      ${t("permanent")}
                    </button>
                    `
                    :`
                    <button
                      class="btn warning"
                      onclick="archiveFile('${f.id}')">
                      ${t("archive")}
                    </button>
                    `
                }

              </div>
              `
          ).join("")
          :`<div class="empty">${t("noData")}</div>`
      }

    </div>
    `;

  document.getElementById("fileForm")
    .onsubmit=e=>{

      e.preventDefault();

      db.files.unshift({
        id:uid("F"),
        ownerId:current().id,
        name:fileName.value,
        desc:fileDesc.value,
        created:Date.now(),
        archived:false
      });

      persist();
      renderFiles(m)
    }
}

function archiveFile(id){

  let f=db.files.find(x=>x.id===id);

  if(f)f.archived=true;

  persist();
  render()
}

function restoreFile(id){

  let f=db.files.find(x=>x.id===id);

  if(f)f.archived=false;

  persist();
  render()
}

function deleteFile(id){

  if(!confirm(t("confirmPermanent")))return;

  db.files=db.files.filter(
    x=>x.id!==id
  );

  persist();
  render()
}

function startReminderCheck(){

  const now=Date.now();
  let changed=false;

  db.apps
    .filter(
      a=>
        a.status==="pending" &&
        !a.archived
    )
    .forEach(a=>{

      if(
        now-a.created>=24*60*60*1000
      ){

        const managers=
          db.users.filter(
            u=>u.role==="manager"
          );

        managers.forEach(m=>{

          const exists=
            db.notifications.some(
              n=>
                n.userId===m.id &&
                n.kind==="reminder" &&
                n.body.includes(a.id) &&
                now-n.created<20*60*60*1000
            );

          if(!exists){

            db.notifications.unshift({
              id:uid("N"),
              userId:m.id,
              title:"承認リマインド",
              body:
                `申請ID ${a.id} の承認が滞留しています。「${typeName(a.type)}」を確認してください。`,
              created:now,
              read:false,
              kind:"reminder"
            });

            changed=true
          }
        })
      }
    });

  if(changed)persist()
}

(function init(){

  try{

    let s=
      JSON.parse(
        localStorage.getItem(SESSION)||"null"
      );

    if(
      s &&
      db.users.some(
        u=>u.id===s.userId
      )
    ){

      session=s;
      openApp();
      startReminderCheck()

    }else{

      logout()
    }

  }catch(e){

    console.error(e);
    logout()
  }

})();
</script>
